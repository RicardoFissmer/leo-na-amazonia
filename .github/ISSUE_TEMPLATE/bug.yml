name: Bug
description: Algo no jogo não funciona como deveria
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigado por avisar! Quanto mais detalhes, mais rápido o Léo volta para a floresta.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      placeholder: "Ex.: na fase 3 o Léo atravessa a onça sem perder vida."
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra o jogo e clique em Jogar
        2. Vá até a fase 3
        3. Encoste na onça
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: dropdown
    id: onde
    attributes:
      label: Onde aconteceu?
      options:
        - Versão Web (GitHub Pages)
        - Executável do Windows (Releases)
        - Rodando no editor do Godot
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do jogo
      description: "Aparece no canto da tela inicial (ex.: v1.7.0)."
  - type: textarea
    id: evidencias
    attributes:
      label: Prints ou vídeo (opcional)
